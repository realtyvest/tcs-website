<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OT Job Board. Telecom Contractor Solutions</title>
<meta name="description" content="Open the OT job board, drop new CSV exports, and see live counts.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1829">

<meta property="og:type"        content="website">
<meta property="og:site_name"   content="Telecom Contractor Solutions">
<meta property="og:title"       content="OT Job Board">
<meta property="og:description" content="Open the job board, drop CSV exports, see live counts.">
<meta property="og:url"         content="https://telecomcontractorsolutions.com/ot.html">
<meta property="og:image"       content="https://telecomcontractorsolutions.com/assets/tcs-logo-bar.png">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:image"      content="https://telecomcontractorsolutions.com/assets/tcs-logo-bar.png">

<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<meta name="apple-mobile-web-app-title" content="OT Board">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --ink:#0B1829; --ink2:#111F35; --line:#1E3050;
    --paper:#F4F7FB; --steel:#8CA3BE;
    --blue:#2A8EFF; --orange:#F26419;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{ width:100%; max-width:100%; overflow-x:hidden; }
  body{
    margin:0; background:var(--ink); color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:34px 20px 40px;
  }

  /* explicit horizontal centring, no reliance on flex alignment */
  .wrap{ width:100%; max-width:840px; margin-left:auto; margin-right:auto; }

  .brand{ text-align:center; margin-bottom:10px; }
  .brand img{ display:inline-block; max-width:340px; width:100%; height:auto; }
  .brand .fallback{
    display:none; font-size:19px; font-weight:800; letter-spacing:1.4px;
    color:var(--paper); text-transform:uppercase;
  }
  .brand.noimg img{ display:none; }
  .brand.noimg .fallback{ display:block; }
  .rule{ height:3px; width:56px; background:var(--orange);
         border-radius:2px; margin:18px auto 30px; }

  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:32px; }
  @media (max-width:640px){ .tiles{ grid-template-columns:1fr; } }

  a.tile{
    display:flex; align-items:center; gap:15px;
    background:var(--ink2); border:1px solid var(--line); border-radius:12px;
    padding:20px 18px; text-decoration:none; color:inherit; min-height:84px;
    transition:border-color .15s, background .15s, transform .06s;
  }
  a.tile:hover{ border-color:var(--blue); background:#132542; }
  a.tile:active{ transform:scale(.985); }
  .ico{ flex:none; width:46px; height:46px; border-radius:10px;
        display:flex; align-items:center; justify-content:center; }
  .ico.b{ background:rgba(42,142,255,.14); }
  .ico.o{ background:rgba(242,100,25,.14); }
  .txt{ flex:1; min-width:0; }
  .t{ display:block; font-size:17px; font-weight:700; margin-bottom:4px; }
  .s{ display:block; font-size:13px; color:var(--steel); line-height:1.4; }
  .chev{ flex:none; color:#40587A; }

  .mhead{ display:flex; align-items:baseline; justify-content:space-between;
          gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .mhead h2{ font-size:15px; margin:0; letter-spacing:.3px; }
  .mhead span{ font-size:11.5px; color:#50678A; }
  .frame{ background:#fff; border:1px solid var(--line); border-radius:12px;
          overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,.28); }
  .frame iframe{ display:block; width:100%; height:620px; border:0; }
  @media (max-width:640px){ .frame iframe{ height:900px; } }

  footer{ text-align:center; margin-top:28px; }
  footer a{ color:#50678A; font-size:12px; text-decoration:none; }
  footer a:hover{ color:var(--steel); }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand" id="brand">
    <img src="/assets/tcs-logo-bar.png" alt="Telecom Contractor Solutions"
         width="800" height="150"
         onerror="document.getElementById('brand').className='brand noimg';">
    <div class="fallback">Telecom Contractor Solutions</div>
  </div>
  <div class="rule"></div>

  <div class="tiles">
    <a class="tile" href="https://docs.google.com/spreadsheets/d/1ythohbabuhqwvBtLDPdHe7l_8zk_qhaXBDt5W56Koqw/edit">
      <span class="ico b" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2A8EFF"
             stroke-width="2" stroke-linecap="square">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">Open the Job Board</span>
        <span class="s">Assign crews, check due dates, close jobs out</span>
      </span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </a>

    <a class="tile" href="https://drive.google.com/drive/folders/1eLL1Id4G3jt62OA3SATnA6SX9MBH4wkR">
      <span class="ico o" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F26419"
             stroke-width="2" stroke-linecap="square">
          <path d="M12 16V4M7 9l5-5 5 5"/>
          <path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">Drop CSV Exports</span>
        <span class="s">Then run Import New Jobs on the board</span>
      </span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true">
        <path d="M9 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <div class="mhead">
    <h2>Live metrics</h2>
    <span>Counts only &middot; refreshes from the board</span>
  </div>
  <div class="frame">
    <iframe title="OT Job Board live metrics" loading="lazy"
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQU74_iuPGb_SYfYmyTpeQE6nZmM5mMiS76zJmZORLszjmAPd-ZHxpfO3O6WpD8NFzVhaNUMzYzAbcR/pubhtml?gid=1067271056&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
  </div>

  <footer><a href="https://telecomcontractorsolutions.com">telecomcontractorsolutions.com</a></footer>

</div>
</body>
</html>
