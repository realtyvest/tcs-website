<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Job Board — Live Metrics | Telecom Contractor Solutions</title>
<meta name="description" content="Live operational metrics for the OT job board. Counts only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1829">

<meta property="og:type"        content="website">
<meta property="og:site_name"   content="Telecom Contractor Solutions">
<meta property="og:title"       content="OT Job Board — Live Metrics">
<meta property="og:description" content="Open jobs, past due, and completions. Updated live.">
<meta property="og:url"         content="https://telecomcontractorsolutions.com/metrics.html">
<meta property="og:image"       content="https://telecomcontractorsolutions.com/assets/tcs-logo-bar.png">
<meta name="twitter:card"       content="summary_large_image">
<meta name="twitter:image"      content="https://telecomcontractorsolutions.com/assets/tcs-logo-bar.png">

<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<meta name="apple-mobile-web-app-title" content="OT Metrics">

<style>
  :root{ --ink:#0B1829; --ink2:#111F35; --line:#1E3050;
         --paper:#F4F7FB; --steel:#8CA3BE; --blue:#2A8EFF; --orange:#F26419; }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--ink); color:var(--paper);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header{ background:var(--ink); border-bottom:1px solid var(--line); padding:18px 20px; }
  .bar{ max-width:1100px; margin:0 auto; display:flex; align-items:center;
        justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .bar img{ height:38px; width:auto; display:block; }
  .bar nav a{ color:var(--steel); text-decoration:none; font-size:13px;
              font-weight:600; margin-left:20px; }
  .bar nav a:hover{ color:var(--paper); }
  main{ max-width:1100px; margin:0 auto; padding:28px 20px 40px; }
  h1{ font-size:22px; margin:0 0 6px; letter-spacing:.3px; }
  .sub{ color:var(--steel); font-size:13px; margin:0 0 22px; line-height:1.5; }
  .rule{ height:3px; width:56px; background:var(--orange); border-radius:2px; margin:0 0 22px; }
  .frame{ background:#fff; border:1px solid var(--line); border-radius:12px;
          overflow:hidden; box-shadow:0 2px 18px rgba(0,0,0,.28); }
  .frame iframe{ display:block; width:100%; height:1500px; border:0; }
  .setup{ background:var(--ink2); border:1px solid var(--line); border-radius:12px;
          padding:22px 20px; }
  .setup h2{ font-size:15px; margin:0 0 12px; }
  .setup ol{ margin:0; padding-left:20px; color:var(--steel);
             font-size:13px; line-height:1.75; }
  .setup code{ background:#0A1526; border:1px solid var(--line); border-radius:4px;
               padding:1px 6px; font-size:12px; color:var(--paper); }
  .warn{ margin-top:14px; padding:11px 13px; border-left:3px solid var(--orange);
         background:rgba(242,100,25,.08); font-size:12.5px; color:#E4C4B2; line-height:1.55; }
  footer{ border-top:1px solid var(--line); margin-top:34px; padding:18px 20px;
          text-align:center; }
  footer a{ color:#50678A; font-size:12px; text-decoration:none; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="/"><img src="/assets/tcs-logo-bar.png" alt="Telecom Contractor Solutions"></a>
    <nav>
      <a href="/ot.html">Job Board</a>
      <a href="/drop.html">Drop CSVs</a>
    </nav>
  </div>
</header>

<main>
  <h1>OT Job Board — Live Metrics</h1>
  <div class="rule"></div>
  <p class="sub">
    Open work, past due, and completions, updated straight from the board.
    Counts only: no job numbers, no customer names, no addresses.
  </p>

  <!-- =================================================================
       PASTE YOUR PUBLISHED URL ON THE LINE BELOW.
       In the Sheet:  File > Share > Publish to web
                      Choose the "Metrics" tab  (NOT Entire Document)
                      Embed > copy the src="..." value
       Replace PUBLISHED_URL_HERE with it, keeping the quotes.
       ================================================================= -->
  <div id="mount"
       data-src="PUBLISHED_URL_HERE"></div>

</main>

<footer>
  <a href="https://telecomcontractorsolutions.com">telecomcontractorsolutions.com</a>
</footer>

<script>
(function () {
  var mount = document.getElementById('mount');
  var src = (mount.getAttribute('data-src') || '').trim();

  if (!src || src === 'PUBLISHED_URL_HERE') {
    mount.className = 'setup';
    mount.innerHTML =
      '<h2>One step left to switch this on</h2>' +
      '<ol>' +
        '<li>In the Sheet, run <code>OT Job Board &rsaquo; Rebuild Metrics Tab</code></li>' +
        '<li><code>File &rsaquo; Share &rsaquo; Publish to web</code></li>' +
        '<li>In the dropdown pick <b>Metrics</b>. Do <b>not</b> leave it on Entire Document.</li>' +
        '<li>Switch to the <b>Embed</b> tab, click Publish, copy the <code>src="…"</code> value</li>' +
        '<li>Paste it into <code>data-src</code> in <code>metrics.html</code>, then push</li>' +
      '</ol>' +
      '<div class="warn"><b>Publish the Metrics tab only.</b> Choosing Entire Document ' +
      'would expose the Jobs tab, which carries customer names and street addresses for ' +
      'every job on the board. The Metrics tab is built to be safe to publish. No other tab is.</div>';
    return;
  }

  var wrap = document.createElement('div');
  wrap.className = 'frame';
  var f = document.createElement('iframe');
  f.src = src;
  f.loading = 'lazy';
  f.title = 'OT Job Board live metrics';
  wrap.appendChild(f);
  mount.appendChild(wrap);
})();
</script>
</body>
</html>
