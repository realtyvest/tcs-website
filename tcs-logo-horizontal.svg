<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" width="260" height="80">
  <defs>
    <style>
      .wl1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; fill: #FFFFFF; letter-spacing: 2px; }
      .wl2 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 26px; fill: #2A8EFF; letter-spacing: 2px; }
      .wl3 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 23px; fill: #8CA3BE; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- Icon mark -->
